<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1190" viewBox="0 0 1580 1190" role="img" aria-labelledby="title desc">
<title id="title">Northstar Retail cloud identity architecture</title>
<desc id="desc">Six separate identity paths: Azure administrators, AWS workforce federation, Azure deployment federation, AWS upload federation, Azure managed identity, and AWS Lambda execution role. Monitoring collects telemetry. All controls are proposed, not deployed.</desc>
